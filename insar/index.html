<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InSAR AI 地表形变与灾害预测平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#080d1a', card: '#0f172a', border: '#1e293b',
                            accent: '#3b82f6', glow: '#60a5fa', danger: '#ef4444',
                            warning: '#f97316', success: '#10b981', cyan: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Chart / ECharts CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #080d1a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        /* 电脑端布局 */
        @media (min-width: 768px) {
            .main-layout {
                display: flex;
                flex-direction: row;
                height: calc(100vh - 3.5rem);
                width: 100%;
                overflow: hidden;
            }
            .panel-left { width: 18rem; flex-shrink: 0; height: 100%; overflow-y: auto; }
            .panel-center { flex: 1; min-width: 0; height: 100%; position: relative; }
            .panel-right { width: 22rem; flex-shrink: 0; height: 100%; overflow-y: auto; }
            .chart-box { height: 15rem; }
        }

        /* 手机端布局 */
        @media (max-width: 767px) {
            .main-layout {
                display: grid;
                grid-template-rows: 50vh 50vh;
                grid-template-columns: 1fr 1fr;
                height: calc(100vh - 3rem);
                width: 100%;
                overflow: hidden;
            }
            .panel-center {
                grid-row: 1;
                grid-column: 1 / span 2;
                height: 100%;
                width: 100%;
                position: relative;
                border-bottom: 1px solid #1e293b;
            }
            .panel-left {
                grid-row: 2;
                grid-column: 1;
                height: 100%;
                width: 100% !important;
                overflow-y: auto;
                border-right: 1px solid #1e293b;
                padding: 0.5rem;
            }
            .panel-right {
                grid-row: 2;
                grid-column: 2;
                height: 100%;
                width: 100% !important;
                overflow-y: auto;
                padding: 0.5rem;
            }
            .chart-box { height: 8.5rem !important; }
            .m-text { font-size: 10px !important; line-height: 1.3; }
            .m-title { font-size: 11px !important; }
        }
    </style>
</head>
<body class="bg-cyber-bg text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- 顶部导航栏 -->
    <header class="h-12 md:h-14 bg-slate-900/90 border-b border-slate-800 px-3 md:px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 md:w-9 md:h-9 rounded-lg bg-blue-600/20 border border-blue-500/50 flex items-center justify-center text-blue-400 text-sm md:text-lg shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-satellite-dish animate-pulse"></i>
            </div>
            <h1 class="font-bold text-xs md:text-base tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-300">
                InSAR AI 地表形变与灾害预测平台
            </h1>
        </div>
        
        <!-- 区域选择按钮栏 -->
        <div class="flex items-center space-x-1 bg-slate-950/80 p-1 rounded-lg border border-slate-800 text-[10px] md:text-xs overflow-x-auto">
            <button onclick="switchRegion('national')" id="btn-national" class="region-btn px-2 py-1 rounded bg-blue-600 text-white font-medium whitespace-nowrap">全国</button>
            <button onclick="switchRegion('beijing')" id="btn-beijing" class="region-btn px-2 py-1 rounded text-slate-300 whitespace-nowrap">北京</button>
            <button onclick="switchRegion('three_gorges')" id="btn-three_gorges" class="region-btn px-2 py-1 rounded text-slate-300 whitespace-nowrap">三峡</button>
            <button onclick="switchRegion('qinghai_tibet')" id="btn-qinghai_tibet" class="region-btn px-2 py-1 rounded text-slate-300 whitespace-nowrap">青藏</button>
            <button onclick="switchRegion('gba')" id="btn-gba" class="region-btn px-2 py-1 rounded text-slate-300 whitespace-nowrap">湾区</button>
            <button onclick="switchRegion('taiwan')" id="btn-taiwan" class="region-btn px-2 py-1 rounded text-slate-300 whitespace-nowrap">台湾</button>
        </div>
    </header>

    <!-- 主布局 -->
    <div class="main-layout">

        <!-- 1. 左侧：图层控制与监视区态势 -->
        <aside class="panel-left bg-slate-900/80 border-r border-slate-800 glass-panel">
            <div class="p-2.5 md:p-3 border-b border-slate-800 space-y-2">
                <div class="m-title text-xs font-semibold text-slate-300 uppercase flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders text-blue-400"></i> 图层控制
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] md:text-[10px] text-slate-400 font-mono"><span>-10mm/a</span><span>0</span><span>+8mm/a</span></div>
                    <div class="h-1.5 rounded-full w-full bg-gradient-to-r from-red-500 via-emerald-400 to-cyan-400"></div>
                </div>
                <select id="filterSelect" onchange="applyFilter(this.value)" class="m-text w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
                    <option value="all">全部测点 (145点)</option>
                    <option value="high_risk">⚠️ 高风险点</option>
                    <option value="seasonal">🌊 周期波动点</option>
                    <option value="stable">🟢 稳定点</option>
                </select>
            </div>

            <div class="p-2.5 md:p-3 space-y-2">
                <div class="m-title text-xs font-semibold text-slate-300 uppercase mb-1.5"><i class="fa-solid fa-chart-pie text-cyan-400 mr-1"></i> 监视区态势</div>
                <div class="space-y-1.5 text-xs">
                    <div onclick="switchRegion('beijing')" class="p-2 rounded bg-slate-950/60 border border-slate-800 cursor-pointer hover:border-blue-500/50">
                        <div class="flex justify-between m-text text-amber-300 font-medium"><span>北京市内</span><span class="text-[9px] bg-amber-500/20 px-1 rounded">中风险</span></div>
                        <div class="text-slate-400 flex justify-between mt-1 m-text"><span>30 点</span><span class="text-red-400">-9.6 mm/a</span></div>
                    </div>
                    <div onclick="switchRegion('three_gorges')" class="p-2 rounded bg-slate-950/60 border border-slate-800 cursor-pointer hover:border-blue-500/50">
                        <div class="flex justify-between m-text text-cyan-300 font-medium"><span>三峡大坝</span><span class="text-[9px] bg-blue-500/20 px-1 rounded">受控</span></div>
                        <div class="text-slate-400 flex justify-between mt-1 m-text"><span>25 点</span><span class="text-cyan-400">±5.8 mm</span></div>
                    </div>
                    <div onclick="switchRegion('qinghai_tibet')" class="p-2 rounded bg-slate-950/60 border border-slate-800 cursor-pointer hover:border-blue-500/50">
                        <div class="flex justify-between m-text text-emerald-300 font-medium"><span>青藏铁路</span><span class="text-[9px] bg-emerald-500/20 px-1 rounded">融沉</span></div>
                        <div class="text-slate-400 flex justify-between mt-1 m-text"><span>35 点</span><span class="text-amber-400">-8~+6 mm</span></div>
                    </div>
                    <div onclick="switchRegion('gba')" class="p-2 rounded bg-slate-950/60 border border-slate-800 cursor-pointer hover:border-blue-500/50">
                        <div class="flex justify-between m-text text-purple-300 font-medium"><span>大湾区</span><span class="text-[9px] bg-red-500/20 px-1 rounded">预警</span></div>
                        <div class="text-slate-400 flex justify-between mt-1 m-text"><span>30 点</span><span class="text-red-400">-9.9 mm/a</span></div>
                    </div>
                    <div onclick="switchRegion('taiwan')" class="p-2 rounded bg-slate-950/60 border border-slate-800 cursor-pointer hover:border-blue-500/50">
                        <div class="flex justify-between m-text text-indigo-300 font-medium"><span>台湾地区</span><span class="text-[9px] bg-indigo-500/20 px-1 rounded">蠕变</span></div>
                        <div class="text-slate-400 flex justify-between mt-1 m-text"><span>25 点</span><span class="text-indigo-400">±7.2 mm</span></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 2. 中间：地图 -->
        <main class="panel-center bg-slate-950">
            <div id="mapChart" class="w-full h-full"></div>
            <!-- 地图缩放控制 -->
            <div class="absolute top-2 right-2 flex flex-col space-y-1 z-10">
                <button onclick="zoomMapIn()" class="w-7 h-7 md:w-8 md:h-8 rounded bg-slate-900/90 border border-slate-700 text-slate-200 flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-plus text-xs"></i></button>
                <button onclick="zoomMapOut()" class="w-7 h-7 md:w-8 md:h-8 rounded bg-slate-900/90 border border-slate-700 text-slate-200 flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-minus text-xs"></i></button>
                <button onclick="resetMapView()" class="w-7 h-7 md:w-8 md:h-8 rounded bg-slate-900/90 border border-slate-700 text-slate-200 flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-compress text-xs"></i></button>
            </div>
        </main>

        <!-- 3. 右侧：测点诊断与 AI 预测 -->
        <aside class="panel-right bg-slate-900/90 border-l border-slate-800 glass-panel">
            <div class="p-2.5 md:p-3 border-b border-slate-800 flex justify-between items-center">
                <span class="m-title text-xs font-semibold text-slate-300 uppercase flex items-center gap-1.5"><i class="fa-solid fa-circle-dot text-rose-500"></i> PS 测点诊断</span>
                <span id="selectedPointRisk" class="px-1.5 py-0.5 rounded text-[9px] bg-red-500/20 text-red-400 border border-red-500/40">高危</span>
            </div>

            <div class="p-2 md:p-3 space-y-2">
                <div class="grid grid-cols-2 gap-1.5 text-xs">
                    <div class="bg-slate-950/70 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">ID</div><div class="font-mono text-blue-300 font-bold m-text truncate" id="detailPointId">PS-BEI-1000</div></div>
                    <div class="bg-slate-950/70 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">战略区</div><div class="text-slate-200 m-text truncate" id="detailRegion">北京</div></div>
                    <div class="bg-slate-950/70 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">速率</div><div class="font-mono text-red-400 font-bold m-text" id="detailVelocity">-8.2 mm/a</div></div>
                    <div class="bg-slate-950/70 p-1.5 rounded border border-slate-800"><div class="text-[9px] text-slate-400">相干性</div><div class="font-mono text-emerald-400 font-bold m-text" id="detailCoherence">0.97</div></div>
                </div>
                
                <div class="bg-slate-950/50 p-1.5 rounded border border-slate-800 text-[10px] m-text truncate">
                    <span class="text-slate-400">设施:</span><span class="text-amber-300 font-medium ml-1" id="detailFeature">朝阳区地下水降水漏斗</span>
                </div>
                
                <!-- 折线图容器 -->
                <div class="chart-box relative w-full bg-slate-950/80 rounded-lg p-1 border border-slate-800">
                    <canvas id="timeSeriesChart"></canvas>
                </div>
                
                <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-2 text-xs">
                    <div class="font-semibold text-slate-300 text-[10px] flex items-center gap-1.5 border-b border-slate-800 pb-1 mb-1 m-title"><i class="fa-solid fa-brain text-purple-400"></i> AI 诊断分析</div>
                    <p class="text-slate-300 text-[9px] md:text-[11px] leading-relaxed m-text" id="detailAiAnalysis">持续沉降，外推未来60帧位移增大，建议注浆。</p>
                </div>
            </div>
        </aside>

    </div>

    <!-- JS 逻辑 -->
    <script>
        const REGIONS = {
            national: { name: '全国全景', center: [104.5, 36.0], zoom: 1.15 },
            beijing: { name: '北京市内', center: [116.4, 39.9], zoom: 9.0 },
            three_gorges: { name: '三峡大坝', center: [111.0, 30.8], zoom: 9.5 },
            qinghai_tibet: { name: '青藏铁路', center: [93.5, 33.5], zoom: 4.2 },
            gba: { name: '粤港澳大湾区', center: [113.8, 22.6], zoom: 8.0 },
            taiwan: { name: '台湾地区', center: [121.0, 23.8], zoom: 7.5 }
        };

        let psPoints = [];
        let selectedPoint = null;
        let activeFilter = 'all';
        let mapChart = null;
        let chartInstance = null;

        function randVelocity() { return -10 + Math.random() * 18; }

        function distributeAlongPolyline(route, count, jitter) {
            const segLens = []; let totalLen = 0;
            for (let i = 0; i < route.length - 1; i++) {
                const dx = route[i + 1].lon - route[i].lon; const dy = route[i + 1].lat - route[i].lat;
                const len = Math.hypot(dx, dy); segLens.push(len); totalLen += len;
            }
            const points = [];
            for (let i = 0; i < count; i++) {
                const target = count === 1 ? totalLen / 2 : (i / (count - 1)) * totalLen;
                let acc = 0, seg = 0;
                while (seg < segLens.length && acc + segLens[seg] < target) { acc += segLens[seg]; seg++; }
                if (seg >= segLens.length) seg = segLens.length - 1;
                const t = segLens[seg] === 0 ? 0 : (target - acc) / segLens[seg];
                let lon = route[seg].lon + (route[seg + 1].lon - route[seg].lon) * t;
                let lat = route[seg].lat + (route[seg + 1].lat - route[seg].lat) * t;
                lon += (Math.random() - 0.5) * jitter; lat += (Math.random() - 0.5) * jitter;
                points.push({ lon, lat });
            }
            return points;
        }

        function generatePSPoints() {
            psPoints = []; let id = 1000;

            const bjFeatures = ['朝阳区地下水降水漏斗', '通州副中心基坑沉降', '地铁10号线双井站', '地铁6号线草房段', '顺义区地热开采区', '大兴机场高速路基'];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2; const r = Math.pow(Math.random(), 0.8);
                const lon = 116.40 + Math.cos(angle) * r * 0.32; const lat = 39.90 + Math.sin(angle) * r * 0.22;
                psPoints.push(createPSPoint(id++, lon, lat, randVelocity(), 'beijing', '北京市内', bjFeatures[Math.floor(Math.random() * bjFeatures.length)], 'linear'));
            }

            const tgRoute = [{ lon: 111.28, lat: 30.70 },{ lon: 110.98, lat: 30.83 },{ lon: 110.34, lat: 31.04 },{ lon: 109.88, lat: 31.08 },{ lon: 109.51, lat: 31.02 }];
            const tgFeatures = ['三峡右岸 2 号坝段', '茅坪库岸滑坡体', '巴东组软岩边坡', '新滩高位滑坡监测点', '秭归县库岸沉降带', '泄洪闸基础应变区'];
            distributeAlongPolyline(tgRoute, 25, 0.06).forEach(p => { psPoints.push(createPSPoint(id++, p.lon, p.lat, randVelocity(), 'three_gorges', '三峡大坝', tgFeatures[Math.floor(Math.random() * tgFeatures.length)], 'seasonal')); });

            const qtRoute = [{ lon: 101.7, lat: 36.6 },{ lon: 98.1, lat: 36.4 },{ lon: 94.9, lat: 36.4 },{ lon: 94.0, lat: 35.6 },{ lon: 92.8, lat: 34.2 },{ lon: 92.4, lat: 33.1 },{ lon: 92.0, lat: 31.5 },{ lon: 91.1, lat: 29.6 }];
            const qtFeatures = ['北麓河多年冻土热融塌陷', '昆仑山口路基冻胀区', '风火山隧道出口', '唐古拉山冻土段 K1135', '清水河特大桥桥墩', '错那湖段风沙路基'];
            distributeAlongPolyline(qtRoute, 35, 0.12).forEach(p => { psPoints.push(createPSPoint(id++, p.lon, p.lat, randVelocity(), 'qinghai_tibet', '青藏铁路', qtFeatures[Math.floor(Math.random() * qtFeatures.length)], 'permafrost')); });

            const gbaRoute = [{ lon: 113.26, lat: 23.13 },{ lon: 113.75, lat: 23.02 },{ lon: 114.06, lat: 22.55 },{ lon: 114.17, lat: 22.32 },{ lon: 113.55, lat: 22.27 },{ lon: 113.55, lat: 22.19 }];
            const gbaFeatures = ['深圳前海吹填区软土固结', '香港国际机场第3跑道填海区', '广州南沙新区地基沉降', '珠海横琴口岸地下空间', '东莞滨海湾新区', '港珠澳大桥人工岛'];
            distributeAlongPolyline(gbaRoute, 30, 0.08).forEach(p => { psPoints.push(createPSPoint(id++, p.lon, p.lat, randVelocity(), 'gba', '粤港澳大湾区', gbaFeatures[Math.floor(Math.random() * gbaFeatures.length)], 'linear')); });

            const twRoute = [{ lon: 121.56, lat: 25.03 },{ lon: 121.30, lat: 24.15 },{ lon: 120.90, lat: 23.30 },{ lon: 120.60, lat: 22.60 },{ lon: 120.85, lat: 21.95 }];
            const twFeatures = ['花莲-台东纵谷板块断层带', '台北盆地城市地下采空沉降', '高雄科技园区地表位移', '中央山脉东麓隆起带', '新竹科学园区地基稳定性', '垦丁断层蠕变监测点'];
            distributeAlongPolyline(twRoute, 25, 0.10).forEach(p => { psPoints.push(createPSPoint(id++, p.lon, p.lat, randVelocity(), 'taiwan', '台湾地区', twFeatures[Math.floor(Math.random() * twFeatures.length)], 'tectonic')); });

            selectedPoint = psPoints[0];
            updateDetailInspector(selectedPoint);
        }

        function createPSPoint(idNum, lon, lat, velocity, regionKey, regionName, featureName, patternType) {
            let coherence = (0.85 + Math.random() * 0.14).toFixed(2);
            let historyData = [];
            for (let i = 0; i < 120; i++) {
                let noise = (Math.random() - 0.5) * 0.6;
                let trend = (velocity / 50) * (i * 0.5);
                if (patternType === 'seasonal') trend += Math.sin((i / 24) * Math.PI * 2) * 5.0;
                else if (patternType === 'permafrost') trend += Math.cos((i / 24) * Math.PI * 2) * 4.0;
                else if (patternType === 'tectonic') trend += Math.sin((i / 60) * Math.PI) * 2.5;
                historyData.push(parseFloat((trend + noise).toFixed(2)));
            }
            let forecastData = []; let lastVal = historyData[119];
            for (let j = 1; j <= 60; j++) {
                let i = 120 + j; let aiNoise = (Math.random() - 0.5) * 0.4;
                let futureTrend = lastVal + (velocity / 50) * (j * 0.5);
                if (patternType === 'seasonal') futureTrend = lastVal + Math.sin((i / 24) * Math.PI * 2) * 5.0 - Math.sin((120 / 24) * Math.PI * 2) * 5.0;
                else if (patternType === 'permafrost') futureTrend = lastVal + Math.cos((i / 24) * Math.PI * 2) * 4.0 - Math.cos((120 / 24) * Math.PI * 2) * 4.0;
                forecastData.push(parseFloat((futureTrend + aiNoise).toFixed(2)));
            }
            return {
                id: `PS-${regionKey.toUpperCase().substring(0,3)}-${idNum}`, lon: parseFloat(lon.toFixed(4)), lat: parseFloat(lat.toFixed(4)),
                velocity: parseFloat(velocity.toFixed(1)), coherence: parseFloat(coherence), regionKey, regionName, featureName, patternType, historyData, forecastData
            };
        }

        function getVelocityColor(v) {
            if (v < -6) return '#ef4444'; if (v < -3) return '#f97316'; if (v < 0) return '#facc15';
            if (v <= 3) return '#10b981'; if (v <= 6) return '#38bdf8'; return '#06b6d4';
        }

        function buildScatterData() {
            return psPoints.filter(pt => {
                if (activeFilter === 'high_risk' && pt.velocity >= -6) return false;
                if (activeFilter === 'seasonal' && pt.patternType !== 'seasonal' && pt.patternType !== 'permafrost') return false;
                if (activeFilter === 'stable' && (pt.velocity < -2 || pt.velocity > 2)) return false;
                return true;
            }).map(pt => ({
                name: pt.featureName, value: [pt.lon, pt.lat, pt.velocity], psId: pt.id,
                itemStyle: { color: pt.id === (selectedPoint && selectedPoint.id) ? '#ffffff' : undefined }
            }));
        }

        function renderMapWithGeoJSON(geoJson) {
            if (!mapChart) mapChart = echarts.init(document.getElementById('mapChart'));
            
            echarts.registerMap('china', geoJson);
            const option = {
                backgroundColor: '#080d1a',
                geo: {
                    map: 'china', roam: true, center: REGIONS.national.center, zoom: REGIONS.national.zoom,
                    label: {
                        show: true,
                        color: '#cbd5e1',
                        fontSize: 9,
                        formatter: function (params) {
                            const full = params.name || '';
                            if (!full) return '';
                            const shortMap = {
                                '北京市': '北京', '天津市': '天津', '上海市': '上海', '重庆市': '重庆',
                                '河北省': '河北', '山西省': '山西', '辽宁省': '辽宁', '吉林省': '吉林',
                                '黑龙江省': '黑龙江', '江苏省': '江苏', '浙江省': '浙江', '安徽省': '安徽',
                                '福建省': '福建', '江西省': '江西', '山东省': '山东', '河南省': '河南',
                                '湖北省': '湖北', '湖南省': '湖南', '广东省': '广东', '海南省': '海南',
                                '四川省': '四川', '贵州省': '贵州', '云南省': '云南', '陕西省': '陕西',
                                '甘肃省': '甘肃', '青海省': '青海', '台湾省': '台湾',
                                '内蒙古自治区': '内蒙古', '广西壮族自治区': '广西', '西藏自治区': '西藏',
                                '宁夏回族自治区': '宁夏', '新疆维吾尔自治区': '新疆',
                                '香港特别行政区': '香港', '澳门特别行政区': '澳门'
                            };
                            return shortMap[full] || full.replace(/省|市|自治区|特别行政区|壮族|回族|维吾尔/g, '');
                        }
                    },
                    itemStyle: { areaColor: '#0f172a', borderColor: '#3b82f6', borderWidth: 1.2, shadowBlur: 10, shadowColor: 'rgba(59,130,246,0.3)' },
                    emphasis: { itemStyle: { areaColor: '#1e293b' }, label: { show: true, color: '#ffffff', fontSize: 10 } }
                },
                series: [{ 
                    name: 'PS 测点', type: 'scatter', coordinateSystem: 'geo', data: buildScatterData(), 
                    // ★ 恢复：将点放大一点，方便点击
                    symbolSize: val => val[2] < -6 ? 7 : 5, 
                    itemStyle: { color: p => getVelocityColor(p.value[2]), borderColor: 'rgba(255,255,255,0.4)', borderWidth: 0.5 } 
                }]
            };
            mapChart.setOption(option);
            setTimeout(() => { if (mapChart) mapChart.resize(); }, 200);

            // ★ 恢复：使用 ECharts 官方的 click 事件（最稳定，PC/移动端通吃）
            mapChart.off('click');
            mapChart.on('click', function (params) {
                if (params.componentType === 'series' && params.seriesType === 'scatter') {
                    const pt = psPoints.find(p => p.id === params.data.psId);
                    if (pt) { 
                        selectedPoint = pt; 
                        updateDetailInspector(pt); 
                        updateChartData(pt); 
                        mapChart.setOption({ series: [{ data: buildScatterData() }] });
                    }
                }
            });
        }

        function loadMapEngine() {
            fetch('./china.json')
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(geoJson => {
                    if (geoJson && Array.isArray(geoJson.features)) {
                        geoJson.features.forEach(feature => {
                            const p = feature.properties || {};
                            if (!p.name && !p.NAME) {
                                p.name = p.省 || p.province || p.ADMIN || p.adcode || '';
                            } else if (!p.name && p.NAME) {
                                p.name = p.NAME;
                            }
                            feature.properties = p;
                        });
                    }
                    renderMapWithGeoJSON(geoJson);
                })
                .catch(err => {
                    console.warn('本地 china.json 加载失败，尝试使用阿里云 DataV 在线数据：', err);
                    fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
                        .then(res => res.json())
                        .then(geoJson => {
                            renderMapWithGeoJSON(geoJson);
                        })
                        .catch(e => {
                            console.error('在线数据也获取失败', e);
                            document.getElementById('mapChart').innerHTML = 
                                '<div class="flex flex-col items-center justify-center h-full text-slate-500 text-xs">' +
                                    '<i class="fa-solid fa-map-location-dot text-3xl mb-2 text-slate-600"></i>' +
                                    '<div>地图加载失败</div>' +
                                    '<div class="mt-1 text-[10px] text-slate-600">请检查 china.json 或网络状态</div>' +
                                '</div>';
                        });
                });
        }

        function initChart() {
            const ctx = document.getElementById('timeSeriesChart').getContext('2d');
            let labels = []; for (let i = 1; i <= 120; i++) labels.push(`T-${121 - i}`); for (let j = 1; j <= 60; j++) labels.push(`F+${j}`);
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [
                    { label: '历史120帧', data: [], borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
                    { label: 'AI预测60帧', data: [], borderColor: '#ec4899', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, tension: 0.2 }
                ]},
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: true, labels: { color: '#94a3b8', font: { size: 9 } } } }, 
                    scales: { 
                        x: { display: false }, 
                        y: { grid: { color: 'rgba(30, 41, 59, 0.4)' }, ticks: { color: '#94a3b8', font: { size: 8 } } } 
                    } 
                }
            });
            if (selectedPoint) updateChartData(selectedPoint);
        }

        function switchRegion(key) {
            const reg = REGIONS[key]; if (!reg || !mapChart) return;
            mapChart.setOption({ geo: { center: reg.center, zoom: reg.zoom } });
            document.querySelectorAll('.region-btn').forEach(btn => { btn.classList.remove('bg-blue-600', 'text-white'); btn.classList.add('text-slate-300'); });
            const activeBtn = document.getElementById(`btn-${key}`);
            if (activeBtn) { activeBtn.classList.add('bg-blue-600', 'text-white'); activeBtn.classList.remove('text-slate-300'); }
            let regPoint = psPoints.find(p => p.regionKey === key);
            if (regPoint) { selectedPoint = regPoint; updateDetailInspector(regPoint); updateChartData(regPoint); mapChart.setOption({ series: [{ data: buildScatterData() }] }); }
        }

        function zoomMapIn() { if (mapChart) mapChart.setOption({ geo: { zoom: mapChart.getOption().geo[0].zoom * 1.3 } }); }
        function zoomMapOut() { if (mapChart) mapChart.setOption({ geo: { zoom: Math.max(mapChart.getOption().geo[0].zoom / 1.3, 0.6) } }); }
        function resetMapView() { switchRegion('national'); }
        
        function applyFilter(val) { activeFilter = val; if (mapChart) mapChart.setOption({ series: [{ data: buildScatterData() }] }); }

        function updateDetailInspector(pt) {
            document.getElementById('detailPointId').innerText = pt.id;
            document.getElementById('detailRegion').innerText = pt.regionName;
            document.getElementById('detailVelocity').innerText = `${pt.velocity} mm/a`;
            document.getElementById('detailCoherence').innerText = pt.coherence;
            document.getElementById('detailFeature').innerText = pt.featureName;
            
            let riskElem = document.getElementById('selectedPointRisk');
            let analysisElem = document.getElementById('detailAiAnalysis');

            if (pt.velocity < -6) {
                riskElem.innerText = '高危'; riskElem.className = 'px-1.5 py-0.5 rounded text-[9px] bg-red-500/20 text-red-400 border border-red-500/40';
                analysisElem.innerText = `速率 ${pt.velocity} mm/a，属加速沉降。AI预测将逼近 -10mm 警戒线，建议现场巡检。`;
            } else if (pt.patternType === 'seasonal') {
                riskElem.innerText = '受控'; riskElem.className = 'px-1.5 py-0.5 rounded text-[9px] bg-blue-500/20 text-blue-400 border border-blue-500/40';
                analysisElem.innerText = `受蓄水周期影响呈 ±5mm 动态弹性恢复，结构状态良好。`;
            } else if (pt.patternType === 'permafrost') {
                riskElem.innerText = '融沉'; riskElem.className = 'px-1.5 py-0.5 rounded text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
                analysisElem.innerText = `夏融冬胀周期交替，振幅约 4mm，建议加强路基散热。`;
            } else {
                riskElem.innerText = '稳定'; riskElem.className = 'px-1.5 py-0.5 rounded text-[9px] bg-slate-700/50 text-slate-300 border border-slate-600';
                analysisElem.innerText = `速率 ${pt.velocity} mm/a，相干性 ${pt.coherence}，地表稳定无异常。`;
            }
        }

        function updateChartData(point) {
            if (!chartInstance) return;
            // 1. 构建历史数据：前120个是真实数据，后60个用 null 填充（保证X轴对齐）
            let hist = [...point.historyData]; 
            for (let i = 0; i < 60; i++) hist.push(null);
            
            // 2. 构建预测数据：前119个用 null 填充，第120个（下标119）接上历史数据的最后一个点
            let fore = new Array(119).fill(null); 
            fore.push(point.historyData[119]); 
            fore.push(...point.forecastData);

            // 3. 强力覆盖数据
            chartInstance.data.datasets[0].data = hist;
            chartInstance.data.datasets[1].data = fore;
            
            // 4. 强制无动画重绘，确保立刻更新
            chartInstance.update('none');
        }

        window.onload = function () {
            generatePSPoints();
            loadMapEngine();
            initChart();
        };

        window.addEventListener('resize', () => { 
            if (mapChart) mapChart.resize(); 
            if (chartInstance) chartInstance.resize();
        });
    </script>
</body>
</html>
