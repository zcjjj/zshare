<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RK3588 + RK182X + FPGA 具身智能主板 Layout 示意图</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-bottom: 5px; font-size: 22px; color: #38bdf8; }
        p.subtitle { margin-top: 0; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .board-container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        svg { display: block; }
    </style>
</head>
<body>

    <h1>RK3588 + RK182X + FPGA 单板 PCBA Layout 示意图</h1>
    <p class="subtitle">集成双目+IMU+4×4 ToF激光雷达+多机协作（Wi-Fi 6 + UWB + 1PPS同步）</p>

    <div class="board-container">
        <svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 阴影滤镜 -->
                <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
                </filter>
                <!-- 箭头样式 -->
                <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444" />
                </marker>
                <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
                </marker>
                <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M1,1 L7,4 L1,7 Z" fill="#22c55e" />
                </marker>
            </defs>

            <!-- 1. PCB 基板 (沉金黑绿工业级配色) -->
            <rect x="20" y="20" width="920" height="600" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="4" filter="url(#drop-shadow)"/>
            <text x="40" y="52" fill="#059669" font-size="14" font-weight="bold">PCB Rev 1.0 (Size: 160mm x 100mm)</text>

            <!-- 2. PCB 螺丝固定孔 -->
            <circle cx="45" cy="45" r="7" fill="#15803d" stroke="#f59e0b" stroke-width="3"/>
            <circle cx="915" cy="45" r="7" fill="#15803d" stroke="#f59e0b" stroke-width="3"/>
            <circle cx="45" cy="595" r="7" fill="#15803d" stroke="#f59e0b" stroke-width="3"/>
            <circle cx="915" cy="595" r="7" fill="#15803d" stroke="#f59e0b" stroke-width="3"/>

            <!-- ==================== 区域划分背景 ==================== -->
            <!-- 传感器与硬同步区 -->
            <rect x="40" y="70" width="220" height="520" rx="12" fill="#022c22" stroke="#047857" stroke-dasharray="4"/>
            <text x="50" y="90" fill="#34d399" font-size="12" font-weight="bold">【传感器输入与硬同步区】</text>

            <!-- 核心计算区 -->
            <rect x="280" y="140" width="410" height="450" rx="12" fill="#0f172a" stroke="#334155" stroke-dasharray="4"/>
            <text x="290" y="160" fill="#94a3b8" font-size="12" font-weight="bold">【核心计算与大模型推理区】</text>

            <!-- 多机无线通信与对外接口区 -->
            <rect x="710" y="70" width="210" height="520" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-dasharray="4"/>
            <text x="720" y="90" fill="#a5b4fc" font-size="12" font-weight="bold">【多机通信与 I/O 拓展区】</text>

            <!-- ==================== 芯片与核心器件 ==================== -->
            
            <!-- FPGA 芯片 -->
            <rect x="80" y="270" width="130" height="130" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="145" y="325" fill="#f3e8ff" font-size="16" font-weight="bold" text-anchor="middle">FPGA</text>
            <text x="145" y="345" fill="#d8b4fe" font-size="11" text-anchor="middle">传感器硬同步/控制</text>

            <!-- IMU 芯片 (紧贴 FPGA) -->
            <rect x="180" y="210" width="35" height="35" rx="4" fill="#701a75" stroke="#f0abfc" stroke-width="2"/>
            <text x="197" y="232" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">IMU</text>

            <!-- RK3588 主控芯片 -->
            <rect x="310" y="240" width="160" height="160" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="390" y="310" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">RK3588</text>
            <text x="390" y="335" fill="#93c5fd" font-size="11" text-anchor="middle">系统主控 AP / VIO</text>
            <text x="390" y="350" fill="#60a5fa" font-size="10" text-anchor="middle">4xA76+4xA55 | 6T NPU</text>

            <!-- RK3588 外围 (LPDDR + eMMC + PMIC) -->
            <rect x="310" y="180" width="70" height="45" rx="4" fill="#334155" stroke="#64748b"/>
            <text x="345" y="207" fill="#cbd5e1" font-size="10" text-anchor="middle">LPDDR5 16G</text>
            <rect x="400" y="180" width="70" height="45" rx="4" fill="#334155" stroke="#64748b"/>
            <text x="435" y="207" fill="#cbd5e1" font-size="10" text-anchor="middle">eMMC 64G</text>
            <rect x="310" y="420" width="160" height="30" rx="4" fill="#475569" stroke="#94a3b8"/>
            <text x="390" y="440" fill="#f1f5f9" font-size="10" text-anchor="middle">RK806 电源管理芯片 (PMIC)</text>

            <!-- RK182X AI 协处理器 -->
            <rect x="530" y="270" width="130" height="130" rx="8" fill="#065f46" stroke="#34d399" stroke-width="3" filter="url(#drop-shadow)"/>
            <text x="595" y="325" fill="#ecfdf5" font-size="16" font-weight="bold" text-anchor="middle">RK182X</text>
            <text x="595" y="345" fill="#a7f3d0" font-size="11" text-anchor="middle">大模型协处理器</text>
            <text x="595" y="360" fill="#34d399" font-size="10" text-anchor="middle">20T NPU + 3D DRAM</text>

            <!-- ==================== 外围传感器接口 (左侧) ==================== -->
            <rect x="50" y="110" width="100" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/>
            <text x="100" y="130" fill="#ffffff" font-size="11" text-anchor="middle">左相机 (MIPI CSI)</text>

            <rect x="50" y="160" width="100" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/>
            <text x="100" y="180" fill="#ffffff" font-size="11" text-anchor="middle">右相机 (MIPI CSI)</text>

            <rect x="50" y="210" width="100" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/>
            <text x="100" y="230" fill="#ffffff" font-size="11" text-anchor="middle">4×4 ToF 雷达座</text>

            <rect x="50" y="470" width="130" height="35" rx="4" fill="#854d0e" stroke="#facc15"/>
            <text x="115" y="492" fill="#ffffff" font-size="11" text-anchor="middle">底盘电机/PWM/CAN</text>

            <!-- ==================== 多机协作与通信接口 (右侧/底部) ==================== -->
            <!-- Wi-Fi 6/7 M.2 卡槽 -->
            <rect x="730" y="120" width="110" height="110" rx="6" fill="#312e81" stroke="#818cf8" stroke-dasharray="2"/>
            <text x="785" y="170" fill="#c7d2fe" font-size="12" font-weight="bold" text-anchor="middle">M.2 Key-E</text>
            <text x="785" y="190" fill="#a5b4fc" font-size="10" text-anchor="middle">Wi-Fi 6/7 Mesh 网卡</text>

            <!-- UWB 模块 -->
            <rect x="730" y="270" width="110" height="60" rx="6" fill="#431407" stroke="#fb923c"/>
            <text x="785" y="300" fill="#ffedd5" font-size="12" font-weight="bold" text-anchor="middle">UWB 测距模组</text>
            <text x="785" y="318" fill="#fdba74" font-size="10" text-anchor="middle">(10cm 级物理测距)</text>

            <!-- 天线接口 (SMA) -->
            <circle cx="880" cy="140" r="12" fill="#b45309" stroke="#fde047" stroke-width="2"/>
            <text x="880" y="144" fill="#ffffff" font-size="9" text-anchor="middle">Wi-Fi</text>
            
            <circle cx="880" cy="300" r="12" fill="#b45309" stroke="#fde047" stroke-width="2"/>
            <text x="880" y="304" fill="#ffffff" font-size="9" text-anchor="middle">UWB</text>

            <!-- 1PPS 硬件同步输入排针 -->
            <rect x="730" y="360" width="110" height="30" rx="4" fill="#701a75" stroke="#f0abfc"/>
            <text x="785" y="380" fill="#ffffff" font-size="11" text-anchor="middle">1PPS / PTP 同步针</text>

            <!-- 板载标准 I/O (右下/底部) -->
            <rect x="730" y="470" width="160" height="40" rx="4" fill="#1e293b" stroke="#64748b"/>
            <text x="810" y="494" fill="#cbd5e1" font-size="11" text-anchor="middle">以太网 (2.5G RJ45) / USB 3.0</text>

            <rect x="310" y="520" width="160" height="40" rx="4" fill="#991b1b" stroke="#f87171"/>
            <text x="390" y="544" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">DC 12V-24V 电源输入</text>

            <!-- ==================== 内部连线与总线 (Bus / Triggers) ==================== -->
            
            <!-- 1. 红色线：FPGA 硬件硬同步触发线 (Trigger Lines) -->
            <path d="M 120 270 L 120 140" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
            <path d="M 130 270 L 130 190" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
            <path d="M 140 270 L 140 240" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
            <path d="M 180 230 L 160 230 L 160 270" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

            <!-- 2. 青色线：相机/传感器视频与数据流直连 RK3588 -->
            <path d="M 150 125 L 310 125 L 310 240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3" marker-end="url(#arrow-cyan)"/>
            <path d="M 150 175 L 290 175 L 290 260 L 310 260" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3" marker-end="url(#arrow-cyan)"/>

            <!-- 3. 绿色线：高速总线 (PCIe 2.0 / 3.0) -->
            <!-- RK3588 <-> RK182X (PCIe) -->
            <line x1="470" y1="335" x2="530" y2="335" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow-green)"/>
            <text x="500" y="325" fill="#4ade80" font-size="10" font-anchor="middle">PCIe</text>

            <!-- RK3588 <-> FPGA (PCIe / SPI) -->
            <line x1="210" y1="335" x2="310" y2="335" stroke="#22c55e" stroke-width="3"/>
            <text x="250" y="325" fill="#4ade80" font-size="10" font-anchor="middle">PCIe/SPI</text>

            <!-- Wi-Fi -> RK3588 (PCIe) -->
            <path d="M 730 175 L 470 175 L 470 240" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4"/>

            <!-- UWB -> RK3588 (UART) -->
            <path d="M 730 300 L 490 300 L 490 380 L 470 380" fill="none" stroke="#fdba74" stroke-width="2"/>

            <!-- 1PPS -> FPGA (硬同步) -->
            <path d="M 730 375 L 200 375 L 200 400" fill="none" stroke="#f0abfc" stroke-width="2" stroke-dasharray="2"/>

            <!-- ==================== 图例 (Legend) ==================== -->
            <g transform="translate(50, 540)">
                <rect x="0" y="0" width="820" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
                <text x="15" y="25" fill="#cbd5e1" font-size="11" font-weight="bold">图例说明：</text>
                
                <line x1="90" y1="22" x2="120" y2="22" stroke="#ef4444" stroke-width="2"/>
                <text x="125" y="25" fill="#fca5a5" font-size="10">纳秒级 Trigger 硬同步</text>

                <line x1="240" y1="22" x2="270" y2="22" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3"/>
                <text x="275" y="25" fill="#93c5fd" font-size="10">MIPI 相机视频流</text>

                <line x1="370" y1="22" x2="400" y2="22" stroke="#22c55e" stroke-width="3"/>
                <text x="405" y="25" fill="#86efac" font-size="10">PCIe 高速数据总线</text>

                <line x1="510" y1="22" x2="540" y2="22" stroke="#818cf8" stroke-width="2" stroke-dasharray="4"/>
                <text x="545" y="25" fill="#c7d2fe" font-size="10">Wi-Fi 网络流量</text>

                <line x1="640" y1="22" x2="670" y2="22" stroke="#fdba74" stroke-width="2"/>
                <text x="675" y="25" fill="#fed7aa" font-size="10">UWB/串口测距数据</text>
            </g>
        </svg>
    </div>

</body>
</html>
