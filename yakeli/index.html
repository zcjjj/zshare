<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>亚克力定制图纸 - 中心线基准</title>
<style>
    @page { size: A4 portrait; margin: 10mm; }
    body {
        margin: 0;
        padding: 20px;
        font-family: 'Microsoft YaHei', sans-serif;
        background: #f0f4f8;
    }
    .page {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .header {
        border-bottom: 2px solid #1e293b;
        padding-bottom: 8px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header h1 { margin: 0; font-size: 20pt; }
    .header p { margin: 0; font-size: 9pt; color: #555; }
    .plate-container {
        margin-top: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 16px;
        background: #fafcff;
    }
    .plate-title {
        font-size: 13pt;
        font-weight: 700;
        color: #1e3a5f;
        margin: 0 0 12px 0;
        border-left: 5px solid #2563eb;
        padding-left: 12px;
    }
    .drawing {
        display: block;
        margin: 0 auto;
        width: 100%;
        height: auto;
        border: 1px solid #e9edf2;
        border-radius: 4px;
        background: white;
    }
    .notes-box {
        margin-top: 18px;
        background: #f1f5f9;
        border-left: 5px solid #2563eb;
        padding: 12px 18px;
        border-radius: 6px;
    }
    .notes-box ul { margin: 0; padding-left: 20px; }
    .notes-box li { margin-bottom: 3px; }
    .legend {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 10px;
        padding: 10px 16px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 9pt;
    }
    .legend-color {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid;
        display: inline-block;
    }
</style>
</head>
<body>
<div class="page">

    <div class="header">
        <div><h1>⏺ 亚克力定制图纸</h1></div>
        <p>单位：cm · 比例 1cm = 40px · 所有尺寸均以红色中心线为基准</p>
    </div>

    <!-- ====== 图一 ====== -->
    <div class="plate-container">
        <div class="plate-title">▍ 图一 · 传感器顶板 (12 × 8 cm) — 中心线基准</div>
        <svg class="drawing" viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eef2f6" stroke-width="1"/>
                </pattern>
                <!-- 主尺寸箭头 -->
                <marker id="arrowDotL" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#334155" stroke="white" stroke-width="1"/>
                    <path d="M 14 7 L 5 2.5 L 5 11.6 Z" fill="#334155"/>
                </marker>
                <marker id="arrowDotR" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#334155" stroke="white" stroke-width="1"/>
                    <path d="M 0 7 L 9 2.5 L 9 11.6 Z" fill="#334155"/>
                </marker>
                <marker id="arrowBlueDotL" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#2563eb" stroke="white" stroke-width="1"/>
                    <path d="M 14 7 L 5 2.5 L 5 11.6 Z" fill="#2563eb"/>
                </marker>
                <marker id="arrowBlueDotR" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#2563eb" stroke="white" stroke-width="1"/>
                    <path d="M 0 7 L 9 2.5 L 9 11.6 Z" fill="#2563eb"/>
                </marker>
                <!-- 单箭头 -->
                <marker id="arrowSingle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 5 L 7 2 L 7 8 Z" fill="currentColor"/>
                </marker>
                <marker id="arrowSingleLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 5 L 3 2 L 3 8 Z" fill="currentColor"/>
                </marker>
                <!-- 超细箭头用于十字标记 -->
                <marker id="arrowTiny" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M 0 4 L 5 1.5 L 5 6.5 Z" fill="currentColor" stroke="none"/>
                </marker>
                <!-- 辐射式十字箭头 -->
                <g id="crossArrow">
                    <line x1="0" y1="0" x2="-20" y2="0" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny)"/>
                    <line x1="0" y1="0" x2="20" y2="0" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny)"/>
                    <line x1="0" y1="0" x2="0" y2="-20" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny)"/>
                    <line x1="0" y1="0" x2="0" y2="20" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny)"/>
                </g>
            </defs>

            <rect width="100%" height="100%" fill="url(#grid)"/>

            <!-- 外框 -->
            <rect x="85" y="60" width="480" height="320" fill="none" stroke="#0f172a" stroke-width="2.5" rx="3"/>

            <!-- 中心十字线 (红色) -->
            <line x1="325" y1="40" x2="325" y2="400" stroke="#e53e3e" stroke-dasharray="6,5" stroke-width="1.5" opacity="0.6"/>
            <line x1="60" y1="220" x2="590" y2="220" stroke="#e53e3e" stroke-dasharray="6,5" stroke-width="1.5" opacity="0.6"/>
            <text x="335" y="396" font-size="7pt" fill="#e53e3e" opacity="0.8" font-weight="bold">垂直中心线</text>
            <text x="95" y="215" font-size="7pt" fill="#e53e3e" opacity="0.8" font-weight="bold">水平中心线</text>





            <!-- ===== 内圈四角孔 (蓝色) ===== -->
            <g stroke="#2563eb" stroke-width="1.2">
                <circle cx="209" cy="120" r="5.5" fill="white"/>
                <circle cx="441" cy="120" r="5.5" fill="white"/>
                <circle cx="209" cy="320" r="5.5" fill="white"/>
                <circle cx="441" cy="320" r="5.5" fill="white"/>
            </g>
            <g color="#2563eb" opacity="0.5">
                <use href="#crossArrow" x="209" y="120"/>
                <use href="#crossArrow" x="441" y="120"/>
                <use href="#crossArrow" x="209" y="320"/>
                <use href="#crossArrow" x="441" y="320"/>
            </g>

            <!-- 内圈横向孔距 -->
            <line x1="209" y1="101" x2="441" y2="101" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL)" marker-end="url(#arrowBlueDotR)"/>
            <rect x="300" y="82" width="60" height="18" fill="white" rx="3"/>
            <text x="325" y="100" font-size="10pt" font-weight="700" text-anchor="middle" fill="#2563eb">孔心距 5.8</text>

            <!-- 内圈纵向孔距 -->
            <line x1="191" y1="120" x2="191" y2="320" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL)" marker-end="url(#arrowBlueDotR)"/>
            <rect x="170" y="195" width="18" height="50" fill="white" rx="3"/>
            <text x="184" y="224" font-size="10pt" font-weight="700" text-anchor="end" fill="#2563eb" transform="rotate(-90 184 224)">孔心距 5.0</text>

            <!-- ===== ★ 内圈边框到中心线的距离 (紫色) — 全部移到右侧 ===== -->
            <!-- 内圈左边界 X=209 → 垂直中心线 X=325，距离 = 116px = 2.9cm -->
            <!-- 内圈右边界 X=441 → 垂直中心线 X=325，距离 = 116px = 2.9cm -->
            <!-- 内圈上边界 Y=120 → 水平中心线 Y=220，距离 = 100px = 2.5cm -->
            <!-- 内圈下边界 Y=320 → 水平中心线 Y=220，距离 = 100px = 2.5cm -->

            <!-- 左边界 → 垂直中心线 2.9cm (放在右侧标注) -->
            <line x1="214" y1="119" x2="320" y2="119" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4" marker-start="url(#arrowSingleLeft)" marker-end="url(#arrowSingle)"/>
            <!-- 标注文字移到右侧 -->
            <text x="262" y="128" font-size="8pt" font-weight="700" text-anchor="middle" fill="#7c3aed">2.9 cm</text>

            <!-- 右边界 → 垂直中心线 2.9cm (放在右侧标注) -->
            <line x1="436" y1="119" x2="330" y2="119" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrowSingleLeft)" marker-end="url(#arrowSingle)"/>
            <rect x="370" y="122" width="44" height="16" fill="white" rx="2"/>
            <text x="392" y="128" font-size="8pt" font-weight="700" text-anchor="middle" fill="#7c3aed">2.9 cm</text>

            <!-- 上边界 → 水平中心线 2.5cm (放在右侧标注) -->
            <line x1="460" y1="120" x2="460" y2="220" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <rect x="445" y="162" width="30" height="16" fill="white" rx="2"/>
            <text x="460" y="168" font-size="8pt" font-weight="700" text-anchor="middle" fill="#7c3aed" transform="rotate(-90 460 174)">2.5 cm</text>

            <!-- 下边界 → 水平中心线 2.5cm (放在右侧标注) -->
            <line x1="480" y1="320" x2="480" y2="220" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <rect x="465" y="258" width="30" height="16" fill="white" rx="2"/>
            <text x="480" y="266" font-size="8pt" font-weight="700" text-anchor="middle" fill="#7c3aed" transform="rotate(-90 480 270)">2.5 cm</text>

            <!-- "内圈边框" 标注移到右侧 -->
  

            <!-- ===== ★ 光流孔 (绿色) — 距垂直中心线 2.6cm，向左移 ===== -->
            <!-- 垂直中心线 X=325，距中心线 2.6cm = 104px，向左移 => X = 325 - 104 = 221 -->
            <!-- Y方向仍距水平中心线 1.4cm (56px)：上孔 Y=220-56=164，下孔 Y=220+56=276 -->
            <g stroke="#2563eb" stroke-width="1.2">
                <circle cx="221" cy="144" r="5" fill="white"/>
                <circle cx="425" cy="144" r="5" fill="white"/>
                <circle cx="221" cy="296" r="5" fill="white"/>
                <circle cx="425" cy="296" r="5" fill="white"/>

            </g>
        
            <!-- 光流上孔 → 水平中心线 1.4cm -->
            <line x1="221" y1="144" x2="221" y2="220"  stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
            <text x="210" y="195" font-size="7pt" font-weight="700" text-anchor="middle" fill="#059669">2.2 </text>

            <!-- 光流下孔 → 水平中心线 1.4cm -->
            <line x1="221" y1="220" x2="221" y2="296"  stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
            <text x="210" y="259" font-size="7pt" font-weight="700" text-anchor="middle" fill="#059669">2.2 </text>

            <!-- 光流孔到垂直中心线的距离 2.6cm (用虚线箭头标出) -->
            <line x1="221" y1="144" x2="325" y2="144" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <text x="274" y="153" font-size="7pt" font-weight="700" text-anchor="middle" fill="#059669">2.2</text>
            <line x1="325" y1="144" x2="425" y2="144" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <text x="355" y="153" font-size="7pt" font-weight="700" text-anchor="middle" fill="#059669">2.2</text>


            <!-- ===== ★ 激光孔 (橙色) — 保持不变 ===== -->
            <!-- 激光孔：X=371，Y上=180，Y下=260 -->
            <g stroke="#ea580c" stroke-width="1.2">
                <circle cx="371" cy="180" r="4.5" fill="white"/>
                <circle cx="371" cy="260" r="4.5" fill="white"/>
            </g>
            <g color="#ea580c" opacity="0.5">
                <use href="#crossArrow" x="371" y="180"/>
                <use href="#crossArrow" x="371" y="260"/>
            </g>

            <!-- 激光上孔 → 水平中心线 1.0cm -->
            <line x1="357" y1="180" x2="357" y2="220" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <rect x="342" y="193" width="30" height="14" fill="white" rx="2"/>
            <text x="357" y="204" font-size="7pt" font-weight="700" text-anchor="middle" fill="#ea580c">1.0 cm</text>

            <!-- 激光下孔 → 水平中心线 1.0cm -->
            <line x1="385" y1="260" x2="385" y2="220" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSingle)"/>
            <rect x="370" y="228" width="30" height="14" fill="white" rx="2"/>
            <text x="385" y="239" font-size="7pt" font-weight="700" text-anchor="middle" fill="#ea580c">1.0 cm</text>

            <!-- 激光孔到垂直中心线的距离 1.15cm -->
            <line x1="371" y1="168" x2="325" y2="168" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#arrowSingleLeft)" marker-end="url(#arrowSingle)"/>
            <rect x="333" y="157" width="38" height="14" fill="white" rx="2"/>
            <text x="352" y="168" font-size="7pt" font-weight="700" text-anchor="middle" fill="#ea580c">1.15 cm</text>



            <!-- 外形尺寸 -->
            <text x="325" y="432" font-size="11pt" font-weight="700" text-anchor="middle" fill="#0f172a">外形 12 cm</text>
            <text x="68" y="220" font-size="11pt" font-weight="700" text-anchor="end" fill="#0f172a" transform="rotate(-90 68 220)">外形 8 cm</text>
        </svg>

        <div class="legend">
            <span class="legend-item"><span class="legend-color" style="border-color:#0f172a;background:#e9edf2;"></span> 全是M3孔</span>

        </div>
    </div>

    <!-- ====== 图二 ====== -->
    <div class="plate-container">
        <div class="plate-title">▍ 图二 · 底板支架 (12 × 8 cm) — 中心线基准</div>
        <svg class="drawing" viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eef2f6" stroke-width="1"/>
                </pattern>
                <marker id="arrowDotL2" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#334155" stroke="white" stroke-width="1"/>
                    <path d="M 14 7 L 5 2.5 L 5 11.6 Z" fill="#334155"/>
                </marker>
                <marker id="arrowDotR2" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#334155" stroke="white" stroke-width="1"/>
                    <path d="M 0 7 L 9 2.5 L 9 11.6 Z" fill="#334155"/>
                </marker>
                <marker id="arrowBlueDotL2" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#2563eb" stroke="white" stroke-width="1"/>
                    <path d="M 14 7 L 5 2.5 L 5 11.6 Z" fill="#2563eb"/>
                </marker>
                <marker id="arrowBlueDotR2" viewBox="0 0 14 14" refX="7" refY="7" markerWidth="9" markerHeight="9" orient="auto">
                    <circle cx="7" cy="7" r="3" fill="#2563eb" stroke="white" stroke-width="1"/>
                    <path d="M 0 7 L 9 2.5 L 9 11.6 Z" fill="#2563eb"/>
                </marker>
                <marker id="arrowSingle2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 5 L 7 2 L 7 8 Z" fill="currentColor"/>
                </marker>
                <marker id="arrowSingleLeft2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 5 L 3 2 L 3 8 Z" fill="currentColor"/>
                </marker>
                <marker id="arrowTiny2" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4" orient="auto">
                    <path d="M 0 4 L 5 1.5 L 5 6.5 Z" fill="currentColor" stroke="none"/>
                </marker>
                <g id="crossArrow2">
                    <line x1="0" y1="0" x2="-20" y2="0" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny2)"/>
                    <line x1="0" y1="0" x2="20" y2="0" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny2)"/>
                    <line x1="0" y1="0" x2="0" y2="-20" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny2)"/>
                    <line x1="0" y1="0" x2="0" y2="20" stroke="currentColor" stroke-width="0.8" marker-end="url(#arrowTiny2)"/>
                </g>
            </defs>

            <rect width="100%" height="100%" fill="url(#grid2)"/>

            <rect x="85" y="60" width="480" height="320" fill="none" stroke="#0f172a" stroke-width="2.5" rx="3"/>
            <line x1="325" y1="40" x2="325" y2="400" stroke="#e53e3e" stroke-dasharray="6,5" stroke-width="1.5" opacity="0.6"/>
            <line x1="60" y1="220" x2="590" y2="220" stroke="#e53e3e" stroke-dasharray="6,5" stroke-width="1.5" opacity="0.6"/>
            <text x="335" y="396" font-size="7pt" fill="#e53e3e" opacity="0.8" font-weight="bold">垂直中心线</text>
            <text x="95" y="215" font-size="7pt" fill="#e53e3e" opacity="0.8" font-weight="bold">水平中心线</text>

           


            <!-- 内圈 -->
            <g stroke="#2563eb" stroke-width="1.2">
                  <circle cx="109" cy="160" r="5.5" fill="white"/>
                    <circle cx="136" cy="140" r="5.5" fill="white"/>
                    
                    <circle cx="109" cy="270" r="5.5" fill="white"/>
                    <circle cx="136" cy="290" r="5.5" fill="white"/>
                    
                    
                <circle cx="209" cy="120" r="5.5" fill="white"/>
                <circle cx="441" cy="120" r="5.5" fill="white"/>
                 <circle cx="515" cy="120" r="5.5" fill="white"/>
                <circle cx="209" cy="320" r="5.5" fill="white"/>
                <circle cx="441" cy="320" r="5.5" fill="white"/>
                 <circle cx="515" cy="320" r="5.5" fill="white"/>
                 
                   <circle cx="515" cy="355" r="5.5" fill="white"/>
                 <circle cx="515" cy="88" r="5.5" fill="white"/>
                <circle cx="385" cy="88" r="5.5" fill="white"/>
                <circle cx="385" cy="355" r="5.5" fill="white"/>



                   
            </g>
            <g color="#2563eb" opacity="0.5">
                <use href="#crossArrow2" x="209" y="120"/>
                <use href="#crossArrow2" x="441" y="120"/>
                <use href="#crossArrow2" x="515" y="120"/>
                <use href="#crossArrow2" x="209" y="320"/>
                <use href="#crossArrow2" x="441" y="320"/>
                <use href="#crossArrow2" x="515" y="320"/>
            </g>

            <line x1="441" y1="121" x2="520" y2="121" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,3" marker-start="url(#arrowBlueDotL)" marker-end="url(#arrowBlueDotR)"/>
             <text x="480" y="120" font-size="8pt" font-weight="700" text-anchor="middle" fill="#7c3aed">孔心距 2.2</text>
            
              <line x1="515" y1="151" x2="570" y2="151" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
             <text x="534" y="140" font-size="8pt" font-weight="100" text-anchor="middle" fill="#2563eb">孔心到边0.9</text>
             
            <line x1="191" y1="120" x2="191" y2="320" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
            <rect x="170" y="195" width="18" height="50" fill="white" rx="3"/>
            <text x="220" y="224" font-size="10pt" font-weight="700" text-anchor="end" fill="#2563eb" transform="rotate(-90 184 224)">孔心距 5.0</text>
            
             <line x1="136" y1="140" x2="136" y2="290" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
            <text x="240" y="190" font-size="9pt" font-weight="800" text-anchor="end" fill="#2563eb" transform="rotate(-90 184 224)">孔心距 4.0</text>
             <line x1="106" y1="160" x2="106" y2="270" stroke="#2563eb" stroke-width="1.2" marker-start="url(#arrowBlueDotL2)" marker-end="url(#arrowBlueDotR2)"/>
            <text x="240" y="140" font-size="9pt" font-weight="800" text-anchor="end" fill="#2563eb" transform="rotate(-90 184 224)">孔心距 1.524</text>
